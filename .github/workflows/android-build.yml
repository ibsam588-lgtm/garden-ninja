name: Android build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze and test Flutter
        run: |
          flutter analyze
          flutter test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/apple-requirements.txt
      - name: Validate release routing and store tooling
        run: python -m unittest discover -s tooling/tests -p 'test_*.py' -v
      - name: Compile Android release and verify the Kotlin migration
        run: |
          flutter build appbundle --release 2>&1 | tee android-build.log
          if rg 'plugins that apply Kotlin Gradle Plugin|Future versions of Flutter will fail' android-build.log; then
            echo '::error::An Android plugin still applies the deprecated Kotlin Gradle Plugin'
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-build-log
          path: android-build.log
          retention-days: 14
      - name: Test native Google purchase-proof verification
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
