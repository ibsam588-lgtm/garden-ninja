name: iOS build

on:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: Build and launch iOS
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Enforce Apple SDK 27 and iOS 15 minimum
        run: python3 tooling/check_apple_sdk.py --sdk-version "$(xcrun --sdk iphoneos --show-sdk-version)"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: false

      - name: Apply upstream Flutter simulator architecture fix
        run: python3 tooling/fix_flutter_simulator_arch.py --flutter-root "$FLUTTER_ROOT"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze and test Flutter
        run: |
          flutter analyze
          flutter test

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/apple-requirements.txt
      - name: Validate release routing and store tooling
        run: python -m unittest discover -s tooling/tests -p 'test_*.py' -v

      - name: Validate Apple configuration
        run: |
          plutil -lint ios/Runner/Info.plist ios/Flutter/AppFrameworkInfo.plist
          ruby -c ios/Podfile
          ruby -c fastlane/Fastfile

      - name: Build unsigned iPhone and iPad release
        run: flutter build ios --release --no-codesign

      - name: Package unsigned device build
        run: tar -C build/ios/iphoneos -czf build/ios/garden-ninja-ios-unsigned.tar.gz Runner.app

      - name: Build iPhone simulator
        env:
          APP_STORE_ID: ${{ vars.APP_STORE_ID }}
        run: |
          flutter build ios --simulator --debug --dart-define=IOS_LAUNCH_PROBE=true \
            --dart-define="APP_STORE_ID=$APP_STORE_ID"
          # Fail before boot/install if a dependency forces an unusable Intel app.
          lipo -verify_arch arm64 build/ios/iphonesimulator/Runner.app/Runner

      - name: Select simulator destination
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; devices=json.load(sys.stdin)["devices"]; runtimes=sorted((r for r in devices if ".iOS-" in r), key=lambda r: tuple(map(int,re.findall(r"\d+",r))), reverse=True); phones=[d for r in runtimes for d in devices[r] if d["name"].startswith("iPhone")]; print(next((d["udid"] for d in phones if "Duo" not in d["name"]), phones[0]["udid"]))')
          echo "IOS_TEST_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"

      - name: Compile native StoreKit tests for Apple Silicon
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcodebuild build-for-testing -workspace ios/Runner.xcworkspace -scheme Runner \
            -sdk iphonesimulator -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -testPlan RunnerTests -only-testing:RunnerTests \
            -derivedDataPath build/ios/storekit-derived-data \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO SUPPORTED_PLATFORMS=iphonesimulator CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ios/storekit-build.log
          lipo -verify_arch arm64 build/ios/storekit-derived-data/Build/Products/Debug-iphonesimulator/Runner.app/Runner
          python3 - <<'PY'
          import os
          from pathlib import Path
          products = Path('build/ios/storekit-derived-data/Build/Products')
          configs = list(products.glob('*.xctestrun'))
          if len(configs) != 1:
              raise SystemExit('Expected one real compiled native test configuration')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'IOS_XCTESTRUN={configs[0].resolve()}\n')
          PY

      - name: Verify simulator destination before boot
        timeout-minutes: 3
        run: |
          xcodebuild -showBuildSettings -json -workspace ios/Runner.xcworkspace -scheme Runner \
            -sdk iphonesimulator -configuration Debug \
            -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE_ID,arch=arm64" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO SUPPORTED_PLATFORMS=iphonesimulator CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/ios-effective-build-settings.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          settings = json.loads((Path(os.environ['RUNNER_TEMP']) / 'ios-effective-build-settings.json').read_text())
          keys = ('SDKROOT', 'SUPPORTED_PLATFORMS', 'PLATFORM_NAME', 'SDK_VARIANT', 'ARCHS',
                  'EXCLUDED_ARCHS', 'ONLY_ACTIVE_ARCH', 'TARGETED_DEVICE_FAMILY', 'IPHONEOS_DEPLOYMENT_TARGET')
          report = [{'target': item['target'], **{key: item['buildSettings'].get(key) for key in keys}} for item in settings]
          text = json.dumps(report, indent=2)
          print(text)
          Path('build/ios/simulator-build-settings.json').write_text(text)
          for item in report:
              if 'iphonesimulator' not in (item['SUPPORTED_PLATFORMS'] or '').split():
                  raise SystemExit(f"{item['target']} does not support the selected simulator platform")
          PY

      - name: Package simulator build
        run: tar -C build/ios/iphonesimulator -czf build/ios/garden-ninja-ios-simulator.tar.gz Runner.app

      - name: Upload iOS builds
        uses: actions/upload-artifact@v7
        with:
          name: garden-ninja-ios-${{ github.run_number }}
          path: |
            build/ios/garden-ninja-ios-unsigned.tar.gz
            build/ios/garden-ninja-ios-simulator.tar.gz
            ios/Podfile.lock
          compression-level: 0
          retention-days: 30

      - name: Launch game on iPhone simulator
        timeout-minutes: 12
        run: |
          # Boot after compilation to avoid memory contention on standard runners.
          DEVICE_ID="$IOS_TEST_DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          echo 'Installing the compiled simulator app'
          xcrun simctl install "$DEVICE_ID" build/ios/iphonesimulator/Runner.app
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.corsairlabs.gardenNinja data)
          FRAME_MARKER="$APP_DATA/tmp/garden_ninja_first_frame"
          rm -f "$FRAME_MARKER"
          # Use the same simulator launch arguments as Flutter, with Apple's
          # console capture, so startup does not depend on debugger discovery.
          echo 'Launching Garden Ninja with simulator console capture'
          xcrun simctl launch --console-pty "$DEVICE_ID" com.corsairlabs.gardenNinja \
            --enable-dart-profiling --enable-checked-mode --verify-entry-points \
            > build/ios/simulator-launch.log 2>&1 &
          SIMULATOR_CONSOLE_PID=$!
          trap 'kill "$SIMULATOR_CONSOLE_PID" 2>/dev/null || true' EXIT
          # Cold iOS 27 runners can spend several minutes loading system
          # frameworks before Dart starts. Still require the real frame marker.
          for attempt in {1..150}; do
            if [ -s "$FRAME_MARKER" ]; then break; fi
            sleep 2
          done
          cat build/ios/simulator-launch.log
          if [ ! -s "$FRAME_MARKER" ]; then
            # Refresh the data-container path and check again before failing.
            APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.corsairlabs.gardenNinja data)
            FRAME_MARKER="$APP_DATA/tmp/garden_ninja_first_frame"
            if [ ! -s "$FRAME_MARKER" ]; then
              echo '::error::Garden Ninja did not render its first frame'
              exit 1
            fi
          fi
          echo 'Garden Ninja rendered its first frame'
          # Inspect the already-running app instead of launching it twice.
          APP_PID=$(pgrep -f '/Runner.app/Runner' | head -n 1)
          [[ "$APP_PID" =~ ^[0-9]+$ ]]
          sleep 15
          # Simulator apps are host processes; signal 0 checks existence without
          # sending a signal. Avoid launchctl inside the simulated device.
          kill -0 "$APP_PID"

      - name: Test native StoreKit purchase, restore and refund
        timeout-minutes: 12
        run: |
          set -o pipefail
          xcrun simctl terminate "$IOS_TEST_DEVICE_ID" com.corsairlabs.gardenNinja || true
          # The normal launch probe has no local StoreKit session. Start tests
          # with a fresh app container and read the plan directly: .xctestrun
          # exports omit its StoreKit configuration on Xcode 27.
          xcrun simctl uninstall "$IOS_TEST_DEVICE_ID" com.corsairlabs.gardenNinja
          xcodebuild test-without-building -workspace ios/Runner.xcworkspace -scheme Runner \
            -testPlan RunnerTests -sdk iphonesimulator -configuration Debug \
            -derivedDataPath build/ios/storekit-derived-data \
            -destination "platform=iOS Simulator,id=$IOS_TEST_DEVICE_ID,arch=arm64" -only-testing:RunnerTests \
            -parallel-testing-enabled NO \
            -resultBundlePath build/ios/storekit-tests.xcresult \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO SUPPORTED_PLATFORMS=iphonesimulator CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/ios/storekit-tests.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('build/ios/storekit-tests.log').read_text()
          if not re.search(r"Test [Cc]ase .*testNonConsumablePurchaseRestorationAndRefund.* passed", log):
              raise SystemExit('Native purchase/restore/refund test did not execute and pass')
          PY

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: garden-ninja-ios-diagnostics
          path: |
            /tmp/flutter_tools.*/flutter_ios_build_temp_dir/*.xcresult
            ios/Podfile.lock
            build/ios/simulator-boot.log
            build/ios/simulator-launch.log
            build/ios/storekit-build.log
            build/ios/simulator-build-settings.json
            build/ios/storekit-tests.log
            build/ios/storekit-tests.xcresult
            build/ios/storekit-derived-data/Build/Products/*.xctestrun
          if-no-files-found: ignore
          retention-days: 7
