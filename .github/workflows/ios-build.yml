name: iOS build

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/ios-build.yml'
      - '.github/workflows/deploy-app-store.yml'
      - 'fastlane/Fastfile'
      - 'tooling/ios_release_config.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: Build and launch iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: false

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Apple configuration
        run: |
          plutil -lint ios/Runner/Info.plist ios/Flutter/AppFrameworkInfo.plist
          ruby -c ios/Podfile
          ruby -c fastlane/Fastfile

      - name: Build unsigned iPhone and iPad release
        run: flutter build ios --release --no-codesign

      - name: Package unsigned device build
        run: tar -C build/ios/iphoneos -czf build/ios/garden-ninja-ios-unsigned.tar.gz Runner.app

      - name: Build iPhone simulator
        env:
          APP_STORE_ID: ${{ vars.APP_STORE_ID }}
        run: >-
          flutter build ios --simulator --debug --dart-define=IOS_LAUNCH_PROBE=true
          --dart-define="APP_STORE_ID=$APP_STORE_ID"

      - name: Package simulator build
        run: tar -C build/ios/iphonesimulator -czf build/ios/garden-ninja-ios-simulator.tar.gz Runner.app

      - name: Upload iOS builds
        uses: actions/upload-artifact@v4
        with:
          name: garden-ninja-ios-${{ github.run_number }}
          path: |
            build/ios/garden-ninja-ios-unsigned.tar.gz
            build/ios/garden-ninja-ios-simulator.tar.gz
            ios/Podfile.lock
          compression-level: 0
          retention-days: 30

      - name: Launch game on iPhone simulator
        timeout-minutes: 8
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/ios/iphonesimulator/Runner.app
          # Launch the compiled app without rebuilding. Flutter can wait for a
          # debugger connection after the game is already rendering, so verify
          # the debug-only first-frame signal instead of waiting on its CLI.
          flutter run --debug --no-resident --no-pub \
            --use-application-binary=build/ios/iphonesimulator/Runner.app \
            -d "$DEVICE_ID" > build/ios/simulator-launch.log 2>&1 &
          FLUTTER_LAUNCH_PID=$!
          trap 'kill "$FLUTTER_LAUNCH_PID" 2>/dev/null || true' EXIT
          for attempt in {1..90}; do
            if grep -q 'GARDEN_NINJA_FIRST_FRAME' build/ios/simulator-launch.log; then break; fi
            sleep 2
          done
          cat build/ios/simulator-launch.log
          if ! grep -q 'GARDEN_NINJA_FIRST_FRAME' build/ios/simulator-launch.log; then
            xcrun simctl io "$DEVICE_ID" screenshot build/ios/iphone-launch.png || true
            echo '::error::Garden Ninja did not render its first frame'
            exit 1
          fi
          # Flutter already launched the app. A second simctl launch can block
          # while Flutter is attaching its debugger; inspect its host PID.
          APP_PID=$(pgrep -f '/Runner.app/Runner' | head -n 1)
          [[ "$APP_PID" =~ ^[0-9]+$ ]]
          sleep 15
          # Simulator apps are host processes; signal 0 checks existence without
          # sending a signal. Avoid launchctl inside the simulated device.
          kill -0 "$APP_PID"
          xcrun simctl io "$DEVICE_ID" screenshot build/ios/iphone-launch.png

      - name: Upload launch screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garden-ninja-ios-preview-${{ github.run_number }}
          path: build/ios/iphone-launch.png
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: garden-ninja-ios-diagnostics
          path: |
            /tmp/flutter_tools.*/flutter_ios_build_temp_dir/*.xcresult
            ios/Podfile.lock
            build/ios/simulator-launch.log
          if-no-files-found: ignore
          retention-days: 7
