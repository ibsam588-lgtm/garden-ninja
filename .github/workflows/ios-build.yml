name: iOS build

on:
  pull_request:
    branches: [main]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.*'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-build:
    name: Build and launch iOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Apple configuration
        run: |
          plutil -lint ios/Runner/Info.plist ios/Flutter/AppFrameworkInfo.plist
          ruby -c ios/Podfile

      - name: Build unsigned iPhone and iPad release
        run: flutter build ios --release --no-codesign

      - name: Package unsigned device build
        run: tar -C build/ios/iphoneos -czf build/ios/garden-ninja-ios-unsigned.tar.gz Runner.app

      - name: Build iPhone simulator
        run: flutter build ios --simulator --debug

      - name: Launch game on iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for group in devices.values() for d in group if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$DEVICE_ID" com.gardenninja.gardenNinja
          sleep 15
          xcrun simctl io "$DEVICE_ID" screenshot build/ios/iphone-launch.png
          # Confirm the app stayed alive after Flutter and native plug-ins started.
          xcrun simctl spawn "$DEVICE_ID" launchctl list | awk '/com.gardenninja.gardenNinja/ && $1 ~ /^[0-9]+$/ { running=1 } END { exit !running }'
          tar -C build/ios/iphonesimulator -czf build/ios/garden-ninja-ios-simulator.tar.gz Runner.app

      - name: Upload iOS builds and launch screenshot
        uses: actions/upload-artifact@v4
        with:
          name: garden-ninja-ios-${{ github.run_number }}
          path: |
            build/ios/garden-ninja-ios-unsigned.tar.gz
            build/ios/garden-ninja-ios-simulator.tar.gz
            build/ios/iphone-launch.png
            ios/Podfile.lock
          retention-days: 30

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: garden-ninja-ios-diagnostics
          path: |
            /tmp/flutter_tools.*/flutter_ios_build_temp_dir/*.xcresult
            ios/Podfile.lock
          if-no-files-found: ignore
          retention-days: 7
