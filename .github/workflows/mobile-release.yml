name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Select exactly one platform
        type: choice
        options: [ ios, android ]
        required: true
      operation:
        description: Validate, upload to testing, or submit/promote an already tested build
        type: choice
        options: [ validate, upload, submit_for_review, promote_production, upload_store_media ]
        default: validate
      version:
        description: Tested Apple app version (App Review only)
        type: string
      build_number:
        description: Tested Apple build number (App Review only)
        type: string
      version_code:
        description: Tested Google internal version code (production promotion only)
        type: string
      youtube_id:
        description: Published YouTube video ID for the Google Play screenshot update
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    name: Select one platform from main
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.select.outputs.platform }}
      upload: ${{ steps.select.outputs.upload }}
      release: ${{ steps.select.outputs.release }}
      operation: ${{ steps.select.outputs.operation }}
      revision: ${{ steps.select.outputs.revision }}
      ref: ${{ steps.select.outputs.ref }}
      commit_sha: ${{ steps.select.outputs.commit_sha }}
      branch: ${{ steps.select.outputs.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Test main-only release selection
        run: node --test .github/scripts/main-release-route.test.cjs
      - name: Read labels of the PR merged into this main commit
        id: select
        uses: actions/github-script@v8
        env:
          RELEASE_INPUTS_JSON: ${{ toJSON(inputs) }}
        with:
          script: >-
            const select = require('./.github/scripts/main-release-route.cjs');

            await select({ github, context, core, inputs: JSON.parse(process.env.RELEASE_INPUTS_JSON || '{}'),
            defaultUpload: false });
    if: github.ref == 'refs/heads/main'
  validate-ios:
    name: Validate iOS
    needs: select
    if: github.ref == 'refs/heads/main' && (needs.select.outputs.platform == 'ios' && needs.select.outputs.operation ==
      'validate')
    uses: ./.github/workflows/ios-build.yml
    with:
      checkout_ref: ${{ needs.select.outputs.revision }}
  play-store-media:
    name: Upload existing screenshots and trailer link
    needs: select
    if: needs.select.outputs.platform == 'android' && needs.select.outputs.operation == 'upload_store_media'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/store-purchases-requirements.txt
      - name: Replace listing media in one Google Play edit
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_VIDEO_ID: ${{ inputs.youtube_id }}
        run: python tooling/upload_play_media.py
  validate-android:
    name: Validate Android
    needs: select
    if: github.ref == 'refs/heads/main' && (needs.select.outputs.platform == 'android' && needs.select.outputs.operation ==
      'validate')
    uses: ./.github/workflows/android-build.yml
    with:
      checkout_ref: ${{ needs.select.outputs.revision }}
  release-ios:
    name: Upload or submit iOS
    needs: select
    if: github.ref == 'refs/heads/main' && (needs.select.outputs.platform == 'ios' &&
      contains(fromJSON('["upload","submit_for_review"]'), needs.select.outputs.operation))
    uses: ./.github/workflows/deploy-app-store.yml
    with:
      operation: ${{ needs.select.outputs.operation }}
      checkout_ref: ${{ needs.select.outputs.revision }}
      release_branch: ${{ needs.select.outputs.branch }}
      version: ${{ inputs.version || '' }}
      build_number: ${{ inputs.build_number || '' }}
    secrets:
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_DISTRIBUTION_PRIVATE_KEY: ${{ secrets.IOS_DISTRIBUTION_PRIVATE_KEY }}
      IOS_TESTFLIGHT_TESTER_EMAILS: ${{ secrets.IOS_TESTFLIGHT_TESTER_EMAILS }}
  release-android:
    name: Upload or promote Android
    needs: select
    if: github.ref == 'refs/heads/main' && (needs.select.outputs.platform == 'android' &&
      contains(fromJSON('["upload","promote_production"]'), needs.select.outputs.operation))
    uses: ./.github/workflows/deploy-google-play.yml
    permissions:
      contents: write
    with:
      checkout_ref: ${{ needs.select.outputs.revision }}
      release_branch: ${{ needs.select.outputs.branch }}
      play_track: ${{ needs.select.outputs.operation == 'promote_production' && 'production' || 'internal' }}
      version_code: ${{ inputs.version_code || '' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
