name: Flutter CI

on:
  # Optional checks for shared-only changes. Platform pipelines already run
  # these checks inline, so a platform update creates one Actions entry.
  workflow_dispatch:


permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/apple-requirements.txt
      - name: Validate platform routing, Apple release inputs and TestFlight handoff
        run: python -m unittest discover -s tooling/tests -p 'test_*.py' -v
    if: github.ref == 'refs/heads/main'
