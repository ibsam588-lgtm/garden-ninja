name: Capture Apple store gameplay

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/capture-apple-media.yml'
      - 'integration_test/apple_preview_test.dart'
      - 'tooling/record_ios_preview.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-gameplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        family: [iPhone, iPad]
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: false
      - name: Use the project's CocoaPods integration
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get
      - name: Boot an available Apple simulator
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '--json']))['devices']
          for runtime in sorted(data, reverse=True):
              devices = [d for d in data[runtime] if d['isAvailable'] and d['name'].startswith(os.environ['FAMILY'])]
              if devices:
                  device = devices[0]
                  break
          else:
              raise RuntimeError('No compatible simulator is available')
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('SIMULATOR_ID=' + device['udid'] + '\n')
          print('Recording on', device['name'], runtime)
          subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=False)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          subprocess.run(['xcrun', 'simctl', 'status_bar', device['udid'], 'override', '--time', '9:41', '--batteryState', 'charged', '--batteryLevel', '100'], check=True)
          PY
      - name: Play and record the actual iOS game
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          mkdir -p build/apple-native-preview
          flutter test integration_test/apple_preview_test.dart -d "$SIMULATOR_ID" \
            --dart-define=STORE_SCREENSHOTS=true --dart-define=APP_STORE_ID=6834694197 \
            > build/apple-native-preview/integration.log 2>&1 &
          PLAYER=$!
          trap 'kill "$PLAYER" 2>/dev/null || true' EXIT
          python3 tooling/record_ios_preview.py --device "$SIMULATOR_ID" \
            --output "build/apple-native-preview/$FAMILY.mp4" || { cat build/apple-native-preview/integration.log; exit 1; }
          wait "$PLAYER" || { cat build/apple-native-preview/integration.log; exit 1; }
          cat build/apple-native-preview/integration.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-native-preview-${{ matrix.family }}
          path: build/apple-native-preview/
          retention-days: 30
