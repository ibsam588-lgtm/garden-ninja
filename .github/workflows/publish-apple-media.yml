name: Upload Apple store media

on:
  push:
    branches: [main]
    paths:
      - 'store-assets/apple/**'
  workflow_dispatch:
    inputs:
      version:
        description: Editable Apple version (blank reads pubspec.yaml)
        type: string

permissions:
  contents: read

concurrency:
  group: garden-ninja-apple-store-media
  cancel-in-progress: false

jobs:
  upload:
    if: vars.IOS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ios-app-store
    env:
      APP_STORE_ID: ${{ vars.APP_STORE_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ vars.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      REQUESTED_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r tooling/apple-requirements.txt
      - name: Upload screenshot and App Preview assets
        run: |
          VERSION="${REQUESTED_VERSION:-$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid Apple version'; exit 1; }
          python tooling/upload_apple_media.py --version "$VERSION"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: apple-media-upload-report
          path: build/apple-media-upload.json
          retention-days: 30
