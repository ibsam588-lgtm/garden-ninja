name: Deploy Android to Google Play

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_PACKAGE_NAME: com.gardenninja.garden_ninja
  FLUTTER_VERSION: "3.44.2"
  PLAY_TRACK: internal

jobs:
  deploy-android:
    name: Build and deploy Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check Google Play deploy secrets
        id: deploy_secrets
        shell: bash
        run: |
          missing=()

          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing+=("ANDROID_KEYSTORE_BASE64")
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -n "$ANDROID_KEY_PASSWORD" ] || missing+=("ANDROID_KEY_PASSWORD")
          [ -n "$ANDROID_KEY_ALIAS" ] || missing+=("ANDROID_KEY_ALIAS")
          [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ] || missing+=("GOOGLE_PLAY_SERVICE_ACCOUNT_JSON")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Google Play deploy skipped. Missing GitHub secrets: ${missing[*]}"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check LevelPlay repo variables
        shell: bash
        env:
          LEVELPLAY_APP_KEY: ${{ vars.LEVELPLAY_APP_KEY }}
          LEVELPLAY_BANNER_AD_UNIT_ID: ${{ vars.LEVELPLAY_BANNER_AD_UNIT_ID }}
          LEVELPLAY_INTERSTITIAL_AD_UNIT_ID: ${{ vars.LEVELPLAY_INTERSTITIAL_AD_UNIT_ID }}
          LEVELPLAY_REWARDED_AD_UNIT_ID: ${{ vars.LEVELPLAY_REWARDED_AD_UNIT_ID }}
        run: |
          missing=()

          [ -n "$LEVELPLAY_APP_KEY" ] || missing+=("LEVELPLAY_APP_KEY")
          [ -n "$LEVELPLAY_BANNER_AD_UNIT_ID" ] || missing+=("LEVELPLAY_BANNER_AD_UNIT_ID")
          [ -n "$LEVELPLAY_INTERSTITIAL_AD_UNIT_ID" ] || missing+=("LEVELPLAY_INTERSTITIAL_AD_UNIT_ID")
          [ -n "$LEVELPLAY_REWARDED_AD_UNIT_ID" ] || missing+=("LEVELPLAY_REWARDED_AD_UNIT_ID")

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release blocked. Missing LevelPlay variables: ${missing[*]}"
            exit 1
          fi

          if [ "$LEVELPLAY_BANNER_AD_UNIT_ID" = "$LEVELPLAY_INTERSTITIAL_AD_UNIT_ID" ] || \
             [ "$LEVELPLAY_BANNER_AD_UNIT_ID" = "$LEVELPLAY_REWARDED_AD_UNIT_ID" ] || \
             [ "$LEVELPLAY_INTERSTITIAL_AD_UNIT_ID" = "$LEVELPLAY_REWARDED_AD_UNIT_ID" ]; then
            echo "::error::Release blocked. Banner, interstitial, and rewarded must use three distinct LevelPlay ad-unit IDs."
            exit 1
          fi

          echo "All three LevelPlay ad units are configured."

      - name: Skip deploy until secrets are configured
        if: steps.deploy_secrets.outputs.configured != 'true'
        run: echo "Checks passed. Add the required GitHub secrets to enable Google Play deploys."

      - name: Set up Ruby
        if: steps.deploy_secrets.outputs.configured == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Fastlane
        if: steps.deploy_secrets.outputs.configured == 'true'
        run: bundle install --jobs 4 --retry 3

      - name: Decode Android upload keystore
        if: steps.deploy_secrets.outputs.configured == 'true'
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=app/upload-keystore.jks"
          } > android/key.properties

      - name: Build release app bundle
        if: steps.deploy_secrets.outputs.configured == 'true'
        shell: bash
        env:
          LEVELPLAY_APP_KEY: ${{ vars.LEVELPLAY_APP_KEY }}
          LEVELPLAY_BANNER_AD_UNIT_ID: ${{ vars.LEVELPLAY_BANNER_AD_UNIT_ID }}
          LEVELPLAY_INTERSTITIAL_AD_UNIT_ID: ${{ vars.LEVELPLAY_INTERSTITIAL_AD_UNIT_ID }}
          LEVELPLAY_REWARDED_AD_UNIT_ID: ${{ vars.LEVELPLAY_REWARDED_AD_UNIT_ID }}
          LEVELPLAY_CHILD_DIRECTED: ${{ vars.LEVELPLAY_CHILD_DIRECTED }}
          LEVELPLAY_TEST_SUITE: ${{ vars.LEVELPLAY_TEST_SUITE }}
        run: |
          build_number=$((10000 + GITHUB_RUN_NUMBER))
          echo "VERSION_CODE=$build_number" >> "$GITHUB_ENV"
          flutter build appbundle --release \
            --build-number "$build_number" \
            --dart-define=LEVELPLAY_APP_KEY="$LEVELPLAY_APP_KEY" \
            --dart-define=LEVELPLAY_BANNER_AD_UNIT_ID="$LEVELPLAY_BANNER_AD_UNIT_ID" \
            --dart-define=LEVELPLAY_INTERSTITIAL_AD_UNIT_ID="$LEVELPLAY_INTERSTITIAL_AD_UNIT_ID" \
            --dart-define=LEVELPLAY_REWARDED_AD_UNIT_ID="$LEVELPLAY_REWARDED_AD_UNIT_ID" \
            --dart-define=LEVELPLAY_CHILD_DIRECTED="${LEVELPLAY_CHILD_DIRECTED:-false}" \
            --dart-define=LEVELPLAY_TEST_SUITE="${LEVELPLAY_TEST_SUITE:-false}"

      - name: Write Google Play service account
        if: steps.deploy_secrets.outputs.configured == 'true'
        shell: bash
        run: printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > fastlane/play-store-service-account.json

      - name: Upload internal release to Google Play
        if: steps.deploy_secrets.outputs.configured == 'true'
        env:
          ANDROID_PACKAGE_NAME: ${{ env.ANDROID_PACKAGE_NAME }}
          PLAY_TRACK: ${{ env.PLAY_TRACK }}
        run: bundle exec fastlane android internal

      - name: Update forced update metadata
        if: steps.deploy_secrets.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_PACKAGE_NAME: ${{ env.ANDROID_PACKAGE_NAME }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          mkdir -p public
          cat > public/app-version.json <<EOF
          {
            "android": {
              "minimumBuild": $VERSION_CODE,
              "latestBuild": $VERSION_CODE,
              "force": true,
              "updateUrl": "https://play.google.com/store/apps/details?id=$ANDROID_PACKAGE_NAME"
            }
          }
          EOF

          if [ -z "$(git status --porcelain public/app-version.json)" ]; then
            echo "public/app-version.json already matches build $VERSION_CODE."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-version.json
          git commit -m "chore: update Android app version metadata [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
